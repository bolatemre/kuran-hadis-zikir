<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üç Nur: Kuran Hadis Zikir · Ücretsiz indir</title>
<meta name="description" content="Ezan vakti, Kur'an, zikir, hatim halkası ve daha fazlası tek uygulamada. Tamamen ücretsiz, araya giren reklam yok.">
<meta property="og:title" content="Üç Nur: Kuran Hadis Zikir">
<meta property="og:description" content="Ezan vakti, Kur'an, zikir, hatim halkası ve daha fazlası tek uygulamada. Tamamen ücretsiz.">
<meta property="og:image" content="https://raw.githubusercontent.com/bolatemre/kuran-hadis-zikir/main/ikon.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f3d2e">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:radial-gradient(700px 500px at 85% 0%,rgba(232,196,110,.18),transparent 60%),linear-gradient(160deg,#175c44,#0f3d2e 55%,#08241a)}
main{width:100%;max-width:420px;text-align:center}
img{width:120px;height:120px;border-radius:28px;box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 2px rgba(232,196,110,.45)}
h1{font-size:30px;margin:20px 0 6px}
p{color:#e9d9a8;line-height:1.5}
.btn{display:block;margin:26px 0 10px;padding:16px 20px;border-radius:999px;background:linear-gradient(90deg,#d4ad55,#f0d48a);color:#0a2b20;font-weight:800;font-size:18px;text-decoration:none}
.btn.ikinci{margin-top:0;background:transparent;color:#f0d48a;box-shadow:inset 0 0 0 2px rgba(240,212,138,.6)}
#not{font-size:14px;opacity:.85;margin-top:14px}
ul{list-style:none;margin-top:22px;font-size:15px;color:#fff;opacity:.92;line-height:1.9}
ul li::before{content:"✓ ";color:#e8c46e;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="https://raw.githubusercontent.com/bolatemre/kuran-hadis-zikir/main/ikon.png" alt="Üç Nur">
  <h1>Üç Nur</h1>
  <p>Kur'an, Hadis ve Zikirde Buluşalım!</p>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.bolatemre.khz">Google Play'den ücretsiz indir</a>
  <a class="btn ikinci" id="ios" href="#" hidden>App Store'dan ücretsiz indir</a>
  <p id="not"></p>
  <ul><li>Tamamen ücretsiz</li><li>Araya giren reklam yok</li><li>Üyelik yok</li></ul>
</main>
<script>
// App Store linki gelince buraya yazılır (ör. https://apps.apple.com/app/id1234567890); boşken iPhone'da "yakında" yazar
var APP_STORE = '';
var PLAY = 'https://play.google.com/store/apps/details?id=com.bolatemre.khz';
var ua = navigator.userAgent || '';
var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var android = /Android/i.test(ua);
if (APP_STORE) { var b = document.getElementById('ios'); b.href = APP_STORE; b.hidden = false; }
if (android) location.replace(PLAY);
else if (ios) {
  if (APP_STORE) location.replace(APP_STORE);
  else document.getElementById('not').textContent = "iPhone sürümü çok yakında App Store'da. Şimdilik Android telefonlarda kullanılabilir.";
}
</script>
</body>
</html>
