name: Namaz vakitleri (AlAdhan)

on:
  workflow_dispatch:
    inputs:
      zorla:
        description: "Tüm illeri baştan çek (1 yaz)"
        required: false
        default: "0"
  schedule:
    - cron: '23 1 1,15 * *'   # ayın 1'i ve 15'i 04:23 (TR)

permissions:
  contents: write

jobs:
  vakitler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 81 il için vakitleri, hicri takvimi ve dini günleri çek
        env:
          ZORLA: ${{ github.event.inputs.zorla }}
        run: node scripts/aladhan-vakitler.js
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vakitler
          git diff --cached --quiet && echo "Değişiklik yok" || (git commit -m "Namaz vakitleri güncellendi" && git push)
